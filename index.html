<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windmore Metals</title>
<style>
:root{--sb:#16231a;--sbh:rgba(255,255,255,.08);--sba:rgba(255,255,255,.14);--sbt:rgba(255,255,255,.65);--sbb:rgba(255,255,255,.08);--pg:#f5f3ef;--cd:#fff;--br:#e8e4db;--br2:#d4cfc5;--tx:#1a1a1a;--tx2:#6b7280;--tx3:#9ca3af;--ac:#c8861a;--acb:#fdf3e0;--gn:#1f6b35;--gnb:#e8f5ec;--rd:#b91c1c;--rdb:#fef2f2;--bl:#1d4ed8;--blb:#eff6ff;--r:8px;--rlg:12px;--sw:220px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--pg);color:var(--tx);min-height:100vh;display:flex;font-size:14px}
#sb{width:var(--sw);background:var(--sb);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .2s}
.sb-logo{padding:18px 20px 14px;border-bottom:1px solid var(--sbb)}
.sb-name{color:#fff;font-size:16px;font-weight:700}
.sb-sub{color:var(--sbt);font-size:11px;margin-top:2px}
.sb-nav{flex:1;padding:8px 10px;overflow-y:auto}
.sb-sec{color:rgba(255,255,255,.3);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:14px 12px 5px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r);color:var(--sbt);cursor:pointer;font-size:13px;margin-bottom:1px;transition:all .12s;user-select:none}
.sb-item:hover{background:var(--sbh);color:#fff}
.sb-item.on{background:var(--sba);color:#fff}
.sb-item i{font-size:17px;flex-shrink:0}
.sb-foot{padding:10px;border-top:1px solid var(--sbb)}
.sb-keybtn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);color:var(--sbt);cursor:pointer;font-size:12px;width:100%;background:none;border:none;font-family:inherit;transition:all .12s}
.sb-keybtn:hover{background:var(--sbh);color:#fff}
#main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
#topbar{height:54px;background:var(--cd);border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 24px;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tb-title{font-size:15px;font-weight:700;flex:1}
#content{padding:24px}
.card{background:var(--cd);border-radius:var(--rlg);border:1px solid var(--br)}
.card-hdr{padding:14px 20px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:600}
.card-body{padding:20px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:20px}
.mc{background:var(--cd);border-radius:var(--r);border:1px solid var(--br);padding:14px 16px}
.mc-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin-bottom:5px}
.mc-val{font-size:22px;font-weight:700}
.mc-sub{font-size:11px;color:var(--tx2);margin-top:3px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);border-bottom:1px solid var(--br);white-space:nowrap;cursor:pointer;user-select:none;transition:color .12s}
th:hover{color:var(--tx)}
th.asc::after{content:' ▲';font-size:9px}
th.desc::after{content:' ▼';font-size:9px}
td{padding:11px 14px;border-bottom:1px solid var(--br);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#faf9f6}
.tstats{display:flex;gap:20px;padding:9px 14px;background:#faf9f6;border-top:1px solid var(--br);font-size:12px;color:var(--tx2);flex-wrap:wrap}
.tstats strong{color:var(--tx)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .12s;font-family:inherit}
.btn-p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn-p:hover{filter:brightness(.92)}
.btn-g{background:none;border-color:var(--br);color:var(--tx)}.btn-g:hover{background:var(--pg)}
.btn-d{background:var(--rdb);color:var(--rd)}.btn-d:hover{background:#fecaca}
.btn-sm{padding:5px 11px;font-size:12px}
.bico{padding:6px;border-radius:var(--r);background:none;border:none;cursor:pointer;color:var(--tx2);transition:all .12s;font-size:16px;display:inline-flex;align-items:center}
.bico:hover{background:var(--pg);color:var(--tx)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.bb{background:var(--blb);color:var(--bl)}.ba{background:var(--acb);color:var(--ac)}.bg{background:var(--gnb);color:var(--gn)}.bgr{background:#f3f4f6;color:#6b7280}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2)}
input,select,textarea{padding:8px 11px;border:1px solid var(--br);border-radius:var(--r);font-size:13px;color:var(--tx);background:#fff;width:100%;font-family:inherit;transition:border-color .12s}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(200,134,26,.1)}
.fpanel{background:#fffdf8;border:1px solid #f0e8d0;border-radius:var(--rlg);padding:20px;margin-bottom:18px}
.fpanel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.fpanel-title{font-size:14px;font-weight:700}
.factions{display:flex;gap:8px;margin-top:16px}
.calc-ok{padding:8px 11px;background:var(--gnb);border:1px solid #86efac;border-radius:var(--r);font-size:14px;font-weight:700;color:var(--gn)}
.calc-off{padding:8px 11px;background:var(--pg);border:1px solid var(--br);border-radius:var(--r);font-size:13px;color:var(--tx2)}
.sw{position:relative}.sw input{padding-left:34px}.sw i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:16px;pointer-events:none}
#toasts{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:11px 16px;background:#1a1a1a;color:#fff;border-radius:var(--r);font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.18);animation:ti .18s ease;min-width:200px;pointer-events:auto}
.tok{background:var(--gn)}.terr{background:var(--rd)}
@keyframes ti{from{transform:translateX(16px);opacity:0}to{transform:none;opacity:1}}
#mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center}
#mbg.open{display:flex}
.modal{background:var(--cd);border-radius:var(--rlg);width:440px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.14)}
.mhdr{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.mtitle{font-size:15px;font-weight:700}
.mbody{padding:16px 24px 24px}
.cpills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.cpill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--br);background:none;color:var(--tx2);transition:all .12s;font-family:inherit}
.pal{background:var(--blb);color:var(--bl);border-color:var(--bl)}.pcu{background:var(--acb);color:var(--ac);border-color:var(--ac)}.pbr{background:var(--gnb);color:var(--gn);border-color:var(--gn)}.pst{background:#f3f4f6;color:#374151;border-color:#9ca3af}
.mbadge{display:inline-flex;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.spin{width:14px;height:14px;border:2px solid var(--br);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.act-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--br)}
.act-item:last-child{border-bottom:none}
.aico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.abuy{background:var(--acb);color:var(--ac)}.asell{background:var(--gnb);color:var(--gn)}
.sc{background:var(--cd);border:1px solid var(--br);border-radius:var(--rlg);padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;transition:border-color .12s,box-shadow .12s;margin-bottom:10px}
.sc:hover{border-color:var(--br2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.sr{color:var(--ac);font-size:12px;font-weight:600}
.smeta{font-size:12px;color:var(--tx2);margin-top:5px;display:flex;flex-wrap:wrap;gap:10px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{background:var(--cd);border:1px solid var(--br);border-radius:var(--rlg);padding:16px;transition:border-color .12s,box-shadow .12s}
.cc:hover{border-color:var(--br2);box-shadow:0 1px 6px rgba(0,0,0,.06)}
.ticon{width:36px;height:36px;background:var(--blb);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.stabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--br)}
.stab{padding:8px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--tx2);transition:all .12s;margin-bottom:-1px;user-select:none}
.stab.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:600}
.stab:hover:not(.on){color:var(--tx)}
.empty{text-align:center;padding:52px 24px}
.empty i{font-size:40px;color:var(--tx3);display:block;margin-bottom:10px}
.empty-t{font-size:14px;font-weight:600;color:var(--tx2)}
.empty-s{font-size:13px;color:var(--tx3);margin-top:4px}
#hamburger{display:none;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--br);border-radius:var(--r);background:none;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.sup-search-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.sup-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.sup-filter{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--br);background:none;color:var(--tx2);transition:all .12s;font-family:inherit}
.sup-filter.on{background:var(--sb);color:#fff;border-color:var(--sb)}
.lead-card{background:var(--cd);border:1px solid var(--br);border-radius:var(--rlg);overflow:hidden;transition:border-color .15s,box-shadow .15s;margin-bottom:10px;display:flex}
.lead-card:hover{border-color:var(--br2);box-shadow:0 3px 12px rgba(0,0,0,.07)}
.lead-accent{width:4px;flex-shrink:0;background:var(--ac)}
.lead-accent.added{background:var(--gn)}
.lead-body{flex:1;padding:14px 16px}
.lead-actions{padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:center;flex-shrink:0;border-left:1px solid var(--br)}
.lead-name{font-size:14px;font-weight:700;margin-bottom:3px}
.lead-meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--tx2);margin-top:5px}
.lead-note{font-size:12px;font-style:italic;color:var(--tx3);margin-top:6px;line-height:1.5}
.tip-card2{background:var(--cd);border:1px solid var(--br);border-radius:var(--rlg);padding:16px 18px;display:flex;gap:14px;transition:border-color .12s,box-shadow .12s}
.tip-card2:hover{border-color:var(--br2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tip-icon2{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--blb)}
.rpt-period-bar{display:flex;gap:6px;margin-bottom:20px}
.rpt-period-btn{padding:6px 16px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--br);background:none;color:var(--tx2);transition:all .12s;font-family:inherit}
.rpt-period-btn.on{background:var(--sb);color:#fff;border-color:var(--sb)}
.rpt-section{margin-bottom:24px}
.rpt-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin-bottom:10px}
.rpt-bar-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--br);font-size:13px}
.rpt-bar-row:last-child{border-bottom:none}
.rpt-bar-label{width:180px;flex-shrink:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpt-bar-track{flex:1;height:8px;background:#f0ede6;border-radius:4px;overflow:hidden}
.rpt-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.rpt-bar-val{width:70px;text-align:right;font-weight:600;font-size:12px;flex-shrink:0}
.rpt-bar-sub{width:60px;text-align:right;font-size:11px;color:var(--tx2);flex-shrink:0}
@media(max-width:768px){#sb{transform:translateX(-100%)}#sb.open{transform:none}#main{margin-left:0}#hamburger{display:flex}.mgrid{grid-template-columns:1fr 1fr}#content{padding:16px}.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="overlay" id="ov" onclick="closeSb()"></div>
<aside id="sb">
  <div class="sb-logo"><div class="sb-name">Windmore Metals</div><div class="sb-sub">Rim & metal recycling</div></div>
  <nav class="sb-nav">
    <div class="sb-sec">Overview</div>
    <div class="sb-item" id="n-dashboard" onclick="go('dashboard')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M4 4h5v5H4V4zm11 0h5v5h-5V4zM4 15h5v5H4v-5zm11 0h5v5h-5v-5z"/></svg>Dashboard</div>
    <div class="sb-sec">Market</div>
    <div class="sb-item" id="n-prices" onclick="go('prices')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M3 20h18M5 20V12m4 8V8m4 12V5m4 15v-4"/></svg>Metal Prices</div>
    <div class="sb-item" id="n-suppliers" onclick="go('suppliers')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 1c0 4.418-6 10-6 10S6 16.418 6 12a6 6 0 1 1 12 0z"/></svg>Find Suppliers</div>
    <div class="sb-sec">Business</div>
    <div class="sb-item" id="n-purchases" onclick="go('purchases')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M4 4h1.5L8 15h9l2.5-8H7M8 15l-1.5-1.5M10 19a1 1 0 1 0 2 0 1 1 0 0 0-2 0m7 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0"/></svg>Purchases</div>
    <div class="sb-item" id="n-sales" onclick="go('sales')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M3 17l6-6 4 4 8-8M14 7h6v6"/></svg>Sales</div>
    <div class="sb-sec">Contacts</div>
    <div class="sb-item" id="n-sources" onclick="go('sources')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm8 4a3 3 0 0 1 3 3v2M15 7a4 4 0 0 1 0 7.75"/></svg>My Sources</div>
    <div class="sb-item" id="n-buyers" onclick="go('buyers')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M10 7h.01M14 7h.01M10 11h.01M14 11h.01"/></svg>Buyers</div>
    <div class="sb-sec">Analytics</div>
    <div class="sb-item" id="n-reports" onclick="go('reports')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 1 1 4 0 2 2 0 0 1-4 0m0 9h6M9 16h4"/></svg>Reports</div>
  </nav>
  <div class="sb-foot">
    <button class="sb-keybtn" onclick="openApiModal()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg><span id="ks">Set API Key</span></button>
  </div>
</aside>
<main id="main">
  <header id="topbar">
    <button id="hamburger" onclick="toggleSb()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="tb-title" id="tbt">Dashboard</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-g btn-sm" id="exp-btn" style="display:none" onclick="exportCSV()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 11l5 5 5-5M12 4v12"/></svg> Export CSV</button>
      <button class="btn btn-p btn-sm" id="add-btn" style="display:none" onclick="toggleForm()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M12 5v14M5 12h14"/></svg> <span id="add-lbl">Add</span></button>
    </div>
  </header>
  <div id="content"></div>
</main>
<div id="toasts"></div>
<div id="mbg">
  <div class="modal">
    <div class="mhdr"><div class="mtitle" id="mtitle"></div><button class="bico" onclick="closeMod()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────────
const BP={
  aluminum:[
    {name:"Clean Auto Wheels (Alloy 356)",lo:1.00,hi:1.30,avg:1.15,tip:"Remove lead weights, valve stems & tires. Top dollar grade."},
    {name:"Dirty / Irony Aluminum Wheels",lo:0.75,hi:0.95,avg:0.85,tip:"Has steel weights or minor contamination attached."},
    {name:"Chrome / Clad Wheels (Plastic Face)",lo:0.50,hi:0.70,avg:0.60,tip:"Plastic face drops value — pry it off if you can."},
    {name:"Semi / Truck Wheels (Alloy 6061)",lo:0.65,hi:0.83,avg:0.74,tip:"Large commercial rims. Great volume play with fleet shops."},
    {name:"Cast Aluminum",lo:0.50,hi:0.75,avg:0.62,tip:"Engine blocks, cast grills, patio furniture."},
    {name:"6063 Extrusion (Clean)",lo:1.10,hi:1.81,avg:1.46,tip:"Window frames, door handles, structural tubing. High value."},
    {name:"Aluminum Sheet (Clean)",lo:0.60,hi:0.85,avg:0.73,tip:"Flat stock, siding, gutters. Keep dry and unpainted."},

// ── SUPPLIER SEARCH ───────────────────────────────────────────
async function searchSuppliers(){
  if(!S.apiKey){openApiModal();return;}
  if(!S.supSearchQ.trim()){toast("Enter a location or type to search","err");return;}
  S.supSearching=true;S.supSearchDone=false;S.supResults=[];render();
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":S.apiKey,"anthropic-version":"2023-06-01"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:2000,
        tools:[{type:"web_search_20250305",name:"web_search"}],
        system:`You search for scrap metal yards, auto salvage yards, and metal recycling centers. Return ONLY a JSON array, no markdown, no backticks, no other text:
[{"name":"Business Name","address":"Full address","phone":"000-000-0000","city":"City, ST","hours":"hours or empty string","rating":"4.5 or empty","notes":"one sentence about what they buy/specialize in","url":"website or empty"}]
Return up to 8 results. If no results found return [].`,
        messages:[{role:"user",content:`Search for scrap metal yards and auto salvage yards near: ${S.supSearchQ}. Find their names, addresses, phone numbers, hours, and what they buy.`}]
      })
    });
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const txt=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    const m=txt.match(/\[[\s\S]*\]/);
    if(m){
      S.supResults=JSON.parse(m[0]);
      toast(`Found ${S.supResults.length} yards`,"ok");
    }else{S.supResults=[];}
  }catch(e){toast("Search failed: "+e.message,"err");S.supResults=[];}
  S.supSearching=false;S.supSearchDone=true;render();
}
function addSearchResult(idx){
  const r=S.supResults[idx];
  if(!r)return;
  if(S.sources.find(x=>x.name===r.name)){toast("Already in your sources");return;}
  S.sources.push({id:uid(),name:r.name,type:"Junkyard",phone:r.phone||"",city:r.city||"",notes:r.notes||""});
  saveLS();toast(r.name+" added to sources","ok");render();
}

function addLead(name){
  const l=DFW.find(x=>x.name===name);if(!l)return;
  if(S.sources.find(x=>x.name===l.name)){toast("Already in your sources");return;}
  S.sources.push({id:uid(),name:l.name,type:"Junkyard",phone:l.phone,city:l.city+", TX",notes:l.note});
  saveLS();toast(l.name+" added to sources","ok");render();
}

function renderPurchases(){
  const rows=applySort(S.purchases);
  const tc=rows.reduce((s,p)=>s+p.paid,0),tl=rows.reduce((s,p)=>s+p.lbs,0);
  const srcOpts=S.sources.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join("");
  const tOpts=MT.map(t=>`<option>${esc(t)}</option>`).join("");
  return`

<div class="fgrid">
  <div class="fg"><label class="fl">Date</label><input type="date" id="p_d" value="${new Date().toISOString().slice(0,10)}"></div>
  <div class="fg"><label class="fl">Source</label><select id="p_s" onchange="$('p_cw').style.display=this.value==='__o'?'':'none'"><option value="">Select…</option>${srcOpts}<option value="__o">Other…</option></select></div>
  <div class="fg" id="p_cw" style="display:none"><label class="fl">Custom name</label><input type="text" id="p_cn" placeholder="Enter name"></div>
  <div class="fg"><label class="fl">Metal Type</label><select id="p_t">${tOpts}</select></div>
  <div class="fg"><label class="fl">Qty (rims)</label><input type="number" id="p_q" min="0" placeholder="0"></div>
  <div class="fg"><label class="fl">Weight (lbs)</label><input type="number" id="p_w" min="0" step="0.1" placeholder="0.0" oninput="pCalc()"></div>
  <div class="fg"><label class="fl">Total Paid ($)</label><input type="number" id="p_tp" min="0" step="0.01" placeholder="0.00" oninput="pCalc()"></div>
  <div class="fg"><label class="fl">Cost per lb</label><div id="p_cpl" class="calc-off">—</div></div>
  <div class="fg" style="grid-column:1/-1"><label class="fl">Notes</label><input type="text" id="p_n" placeholder="Optional"></div>
</div>
<div class="factions"><button class="btn btn-p" onclick="savePurchase()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M5 12l5 5L20 7"/></svg> Save Purchase</button><button class="btn btn-g" onclick="S.form=false;render()">Cancel</button></div>
</div>`:""}
<div class="card">
  <div class="card-hdr"><div class="card-title">All Purchases (${rows.length})</div><div class="sw"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M10 10m-7 0a7 7 0 1 0 14 0 7 7 0 0 0-14 0M21 21l-6-6"/></svg><input type="search" placeholder="Search…" value="${esc(S.q)}" oninput="S.q=this.value;render()" style="width:200px"></div></div>
  <div class="tw"><table><thead><tr>${TH("Date","date")}${TH("Source","src")}<th>Type</th>${TH("Qty","qty")}${TH("Weight","lbs")}${TH("Paid","paid")}<th style="text-align:right">$/lb</th><th></th></tr></thead>
  <tbody>${rows.length?rows.map(p=>`<tr><td>${p.date}</td><td><strong>${esc(p.src)}</strong>${p.notes?`<div style="font-size:11px;color:var(--tx3)">${esc(p.notes)}</div>`:""}</td><td>${typeBadge(p.type)}</td><td>${p.qty>0?p.qty+" rims":"—"}</td><td>${fmtLb(p.lbs)}</td><td><strong>${fmtD(p.paid)}</strong></td><td style="text-align:right;font-family:monospace;font-size:12px">$${(p.paid/p.lbs).toFixed(3)}</td><td><button class="bico" onclick="delPurchase(${p.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/></svg></button></td></tr>`).join(""):`<tr><td colspan="8"><div class="empty"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M4 4h1.5L8 15h9l2.5-8H7M8 15l-1.5-1.5M10 19a1 1 0 1 0 2 0 1 1 0 0 0-2 0m7 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0"/></svg><div class="empty-t">No purchases logged yet</div><div class="empty-s">Click "Log Purchase" above to get started</div></div></td></tr>`}
  </tbody></table></div>
  ${rows.length?`<div class="tstats"><span>Spent: <strong>${fmtD(tc)}</strong></span><span>Weight: <strong>${fmtLb(tl)}</strong></span><span>Avg $/lb: <strong>$${tl?(tc/tl).toFixed(3):"—"}</strong></span><span>Records: <strong>${rows.length}</strong></span></div>`:""}
</div>`;

function pCalc(){const w=parseFloat($("p_w")?.value)||0,t=parseFloat($("p_tp")?.value)||0,el=$("p_cpl");if(el){if(w&&t){el.textContent="$"+(t/w).toFixed(3)+"/lb";el.className="calc-ok";}else{el.textContent="—";el.className="calc-off";}}}
function savePurchase(){
  let src=$("p_s").value;if(src==="__o")src=($("p_cn").value||"").trim();
  const w=parseFloat($("p_w").value),t=parseFloat($("p_tp").value);
  if(!src){toast("Select or enter a source","err");return;}if(!w||!t){toast("Weight and paid are required","err");return;}
  S.purchases.push({id:uid(),date:$("p_d").value,src,type:$("p_t").value,qty:parseInt($("p_q").value)||0,lbs:w,paid:t,notes:($("p_n").value||"").trim()});
  saveLS();S.form=false;toast("Purchase logged","ok");render();
}
function delPurchase(id){confirmDel("Delete this purchase? Cannot be undone.",()=>{S.purchases=S.purchases.filter(p=>p.id!==id);saveLS();toast("Purchase deleted");render();});}

// ── REPORTS ───────────────────────────────────────────────────
function renderReports(){
  const now=new Date();
  const periods={
    week:{label:"This Week",fn:d=>{const t=new Date();t.setDate(t.getDate()-7);return new Date(d)>=t;}},
    month:{label:"This Month",fn:d=>d.startsWith(now.toISOString().slice(0,7))},
    quarter:{label:"This Quarter",fn:d=>{const m=parseInt(d.slice(5,7))-1,y=parseInt(d.slice(0,4)),q=Math.floor(m/3);const qm=q*3;return y===now.getFullYear()&&m>=qm&&m<qm+3;}},
    year:{label:"This Year",fn:d=>d.startsWith(now.getFullYear().toString())},
    all:{label:"All Time",fn:()=>true},
  };
  const p=periods[S.rptPeriod]||periods.all;
  const purch=S.purchases.filter(x=>p.fn(x.date));
  const sales=S.sales.filter(x=>p.fn(x.date));
  const tc=purch.reduce((s,x)=>s+x.paid,0);
  const tr=sales.reduce((s,x)=>s+x.total,0);
  const profit=tr-tc;
  const lb=purch.reduce((s,x)=>s+x.lbs,0);
  const ls=sales.reduce((s,x)=>s+x.lbs,0);
  const mg=tr>0?(profit/tr)*100:0;
  const roi=tc>0?(profit/tc)*100:0;

  // Purchases by source
  const srcMap={};
  purch.forEach(x=>{if(!srcMap[x.src])srcMap[x.src]={lbs:0,paid:0,count:0};srcMap[x.src].lbs+=x.lbs;srcMap[x.src].paid+=x.paid;srcMap[x.src].count+=x.qty||1;});
  const srcRows=Object.entries(srcMap).sort((a,b)=>b[1].paid-a[1].paid);
  const maxSrcPaid=srcRows[0]?srcRows[0][1].paid:1;

  // Sales by buyer
  const buyMap={};
  sales.forEach(x=>{if(!buyMap[x.buyer])buyMap[x.buyer]={lbs:0,total:0,txns:0};buyMap[x.buyer].lbs+=x.lbs;buyMap[x.buyer].total+=x.total;buyMap[x.buyer].txns++;});
  const buyRows=Object.entries(buyMap).sort((a,b)=>b[1].total-a[1].total);
  const maxBuy=buyRows[0]?buyRows[0][1].total:1;

  // Metal type breakdown
  const typeMap={};
  purch.forEach(x=>{if(!typeMap[x.type])typeMap[x.type]={cost:0,lbsIn:0};typeMap[x.type].cost+=x.paid;typeMap[x.type].lbsIn+=x.lbs;});
  sales.forEach(x=>{if(!typeMap[x.type])typeMap[x.type]={cost:0,lbsIn:0};if(!typeMap[x.type].rev)typeMap[x.type].rev=0;if(!typeMap[x.type].lbsOut)typeMap[x.type].lbsOut=0;typeMap[x.type].rev=(typeMap[x.type].rev||0)+x.total;typeMap[x.type].lbsOut=(typeMap[x.type].lbsOut||0)+x.lbs;});
  const typeRows=Object.entries(typeMap).sort((a,b)=>(b[1].rev||0)-(a[1].rev||0));

  // Monthly trend (last 6 months)
  const monthMap={};
  const allItems=[...S.purchases.map(x=>({date:x.date,type:"cost",val:x.paid})),...S.sales.map(x=>({date:x.date,type:"rev",val:x.total}))];
  allItems.forEach(x=>{const mo=x.date.slice(0,7);if(!monthMap[mo])monthMap[mo]={cost:0,rev:0};monthMap[mo][x.type]+=x.val;});
  const monthRows=Object.entries(monthMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);
  const maxMonth=Math.max(...monthRows.map(([,v])=>Math.max(v.cost,v.rev)),1);

  const pBar=(val,max,color)=>`<div class="rpt-bar-track"><div class="rpt-bar-fill" style="width:${Math.max((val/max)*100,2).toFixed(1)}%;background:${color}"></div></div>`;
  const moLabel=m=>{const[y,mo]=m.split("-");return new Date(y,mo-1).toLocaleString("default",{month:"short",year:"2-digit"});};

  return`
<div class="rpt-period-bar">
  ${Object.entries(periods).map(([k,v])=>`<button class="rpt-period-btn ${S.rptPeriod===k?"on":""}" onclick="S.rptPeriod='${k}';render()">${v.label}</button>`).join("")}
</div>

<div class="mgrid" style="margin-bottom:24px">
  <div class="mc"><div class="mc-lbl">Revenue</div><div class="mc-val" style="color:var(--gn)">${fmtD(tr)}</div><div class="mc-sub">${ls.toLocaleString()} lbs sold</div></div>
  <div class="mc"><div class="mc-lbl">Cost</div><div class="mc-val">${fmtD(tc)}</div><div class="mc-sub">${lb.toLocaleString()} lbs bought</div></div>
  <div class="mc"><div class="mc-lbl">Gross Profit</div><div class="mc-val" style="color:${profit>=0?"var(--gn)":"var(--rd)"}">${fmtD(profit)}</div><div class="mc-sub">${mg.toFixed(1)}% margin</div></div>
  <div class="mc"><div class="mc-lbl">ROI on Cost</div><div class="mc-val" style="color:${roi>=0?"var(--gn)":"var(--rd)"}">${roi.toFixed(1)}%</div><div class="mc-sub">${purch.length} purchase${purch.length!==1?"s":""}, ${sales.length} sale${sales.length!==1?"s":""}</div></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">

  <div class="card">
    <div class="card-hdr"><div class="card-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0;vertical-align:-2px"><path d="M4 4h1.5L8 15h9l2.5-8H7M8 15l-1.5-1.5M10 19a1 1 0 1 0 2 0 1 1 0 0 0-2 0m7 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0"/></svg>Spending by Source</div><span style="font-size:12px;color:var(--tx2)">${srcRows.length} source${srcRows.length!==1?"s":""}</span></div>
    <div class="card-body" style="padding:14px 20px">
      ${srcRows.length?srcRows.map(([name,v])=>`
      <div class="rpt-bar-row">
        <div class="rpt-bar-label" title="${esc(name)}">${esc(name)}</div>
        ${pBar(v.paid,maxSrcPaid,"var(--ac)")}
        <div class="rpt-bar-val">${fmtD(v.paid)}</div>
        <div class="rpt-bar-sub">${fmtLb(v.lbs)}</div>
      </div>`).join(""):`<div class="empty" style="padding:24px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M4 4h1.5L8 15h9l2.5-8H7M8 15l-1.5-1.5M10 19a1 1 0 1 0 2 0 1 1 0 0 0-2 0m7 0a1 1 0 1 0 2 0 1 1 0 0 0-2 0"/></svg><div class="empty-t">No purchases in this period</div></div>`}
    </div>
  </div>

  <div class="card">
    <div class="card-hdr"><div class="card-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0;vertical-align:-2px"><path d="M3 17l6-6 4 4 8-8M14 7h6v6"/></svg>Revenue by Buyer</div><span style="font-size:12px;color:var(--tx2)">${buyRows.length} buyer${buyRows.length!==1?"s":""}</span></div>
    <div class="card-body" style="padding:14px 20px">
      ${buyRows.length?buyRows.map(([name,v])=>`
      <div class="rpt-bar-row">
        <div class="rpt-bar-label" title="${esc(name)}">${esc(name)}</div>
        ${pBar(v.total,maxBuy,"var(--gn)")}
        <div class="rpt-bar-val" style="color:var(--gn)">${fmtD(v.total)}</div>
        <div class="rpt-bar-sub">${fmtLb(v.lbs)}</div>
      </div>`).join(""):`<div class="empty" style="padding:24px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M3 17l6-6 4 4 8-8M14 7h6v6"/></svg><div class="empty-t">No sales in this period</div></div>`}
    </div>
  </div>

</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">

  <div class="card">
    <div class="card-hdr"><div class="card-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0;vertical-align:-2px"><path d="M3 20h18M5 20V12m4 8V8m4 12V5m4 15v-4"/></svg>P&amp;L by Metal Type</div></div>
    <div class="tw">
      <table>
        <thead><tr><th>Metal Type</th><th style="text-align:right">Cost In</th><th style="text-align:right">Revenue</th><th style="text-align:right">Profit</th><th style="text-align:right">Margin</th></tr></thead>
        <tbody>
          ${typeRows.length?typeRows.map(([type,v])=>{
            const rev=v.rev||0,cost=v.cost||0,pr=rev-cost,mg2=rev>0?((pr/rev)*100):null;
            return`<tr><td>${typeBadge(type)}</td><td style="text-align:right;font-size:12px">${fmtD(cost)}</td><td style="text-align:right;font-size:12px;color:var(--gn)">${fmtD(rev)}</td><td style="text-align:right;font-weight:700;color:${pr>=0?"var(--gn)":"var(--rd)"}">${fmtD(pr)}</td><td style="text-align:right;font-size:12px">${mg2!==null?mg2.toFixed(1)+"%":"—"}</td></tr>`;}).join("")
            :`<tr><td colspan="5"><div class="empty" style="padding:24px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M3 20h18M5 20V12m4 8V8m4 12V5m4 15v-4"/></svg><div class="empty-t">No data in this period</div></div></td></tr>`}
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-hdr"><div class="card-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0;vertical-align:-2px"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7zm0 4h16M8 3v4m8-4v4"/></svg>Monthly Trend</div><span style="font-size:12px;color:var(--tx2)">Last 6 months</span></div>
    <div class="card-body" style="padding:14px 20px">
      ${monthRows.length?monthRows.reverse().map(([mo,v])=>`
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
          <strong>${moLabel(mo)}</strong>
          <span style="color:${(v.rev-v.cost)>=0?"var(--gn)":"var(--rd)"}">Profit: ${fmtD(v.rev-v.cost)}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:3px">
          <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)">
            <span style="width:48px">Revenue</span>
            <div style="flex:1;height:6px;background:#f0ede6;border-radius:3px;overflow:hidden"><div style="height:100%;border-radius:3px;background:var(--gn);width:${Math.max((v.rev/maxMonth)*100,v.rev>0?2:0).toFixed(1)}%"></div></div>
            <span style="width:64px;text-align:right;font-weight:600;color:var(--gn)">${fmtD(v.rev)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2)">
            <span style="width:48px">Cost</span>
            <div style="flex:1;height:6px;background:#f0ede6;border-radius:3px;overflow:hidden"><div style="height:100%;border-radius:3px;background:var(--ac);width:${Math.max((v.cost/maxMonth)*100,v.cost>0?2:0).toFixed(1)}%"></div></div>
            <span style="width:64px;text-align:right;font-weight:600">${fmtD(v.cost)}</span>
          </div>
        </div>
      </div>`).join(""):`<div class="empty" style="padding:24px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;flex-shrink:0"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7zm0 4h16M8 3v4m8-4v4"/></svg><div class="empty-t">No historical data yet</div></div>`}
    </div>
  </div>

</div>`;
}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  const m={dashboard:renderDashboard,prices:renderPrices,suppliers:renderSuppliers,purchases:renderPurchases,sales:renderSales,sources:renderSources,buyers:renderBuyers,reports:renderReports};
  $("content").innerHTML=m[S.tab]?m[S.tab]():"";
}

// ── INIT ──────────────────────────────────────────────────────
loadLS();
$("ks").textContent=S.apiKey?"API Key ✓":"Set API Key";
go("dashboard");
if(S.apiKey&&pricesStale())setTimeout(fetchPrices,1800);
</script>
</body>
</html>
