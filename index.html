<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScrapTrack | Windmore Metals</title>
<style>
:root{--dark:#16231a;--dark2:#203529;--bg:#f5f3ef;--card:#fff;--line:#e8e4db;--text:#1f2933;--muted:#6b7280;--gold:#c8861a;--gold2:#fdf3e0;--green:#1f6b35;--green2:#e8f5ec;--red:#b91c1c;--red2:#fef2f2;--blue:#1d4ed8;--blue2:#eff6ff;--radius:12px;--sidebar:230px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;display:flex;min-height:100vh}button,input,select,textarea{font:inherit}a{color:inherit}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--dark);color:white;display:flex;flex-direction:column;z-index:20}.brand{padding:20px;border-bottom:1px solid rgba(255,255,255,.1)}.brand b{font-size:17px}.brand span{display:block;margin-top:3px;font-size:12px;color:rgba(255,255,255,.62)}.nav{padding:10px;overflow:auto}.nav small{display:block;color:rgba(255,255,255,.33);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:10px;padding:14px 12px 6px}.nav button{width:100%;border:0;background:transparent;color:rgba(255,255,255,.7);padding:10px 12px;border-radius:9px;text-align:left;cursor:pointer;margin:1px 0;display:flex;gap:9px;align-items:center}.nav button:hover,.nav button.active{background:rgba(255,255,255,.11);color:white}.main{margin-left:var(--sidebar);width:calc(100% - var(--sidebar));min-height:100vh}.top{height:58px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 22px;position:sticky;top:0;z-index:10}.top h1{font-size:16px;margin:0;flex:1}.content{padding:22px}.mobile{display:none;border:1px solid var(--line);background:white;border-radius:8px;padding:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.03);overflow:hidden}.card+.card{margin-top:16px}.card-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.card-h b{font-size:15px}.card-b{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.metric{background:white;border:1px solid var(--line);border-radius:11px;padding:15px}.metric small{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}.metric strong{font-size:24px}.metric span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.btn{border:1px solid transparent;background:white;border-radius:9px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}.btn.primary{background:var(--gold);border-color:var(--gold);color:white}.btn.ghost{border-color:var(--line);color:var(--text)}.btn.danger{background:var(--red2);color:var(--red)}.btn.small{font-size:12px;padding:6px 10px}.btn:hover{filter:brightness(.96)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{min-width:230px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:white;width:100%;color:var(--text)}textarea{min-height:72px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:11px 13px;text-align:left;vertical-align:middle}th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:#faf9f6}tbody tr:hover td{background:#fffdf8}.right{text-align:right}.muted{color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}.b-blue{background:var(--blue2);color:var(--blue)}.b-green{background:var(--green2);color:var(--green)}.b-gold{background:var(--gold2);color:var(--gold)}.b-gray{background:#f3f4f6;color:#4b5563}.b-red{background:var(--red2);color:var(--red)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:white;border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--muted);font-weight:700;font-size:12px}.tabs button.active{background:var(--dark);border-color:var(--dark);color:white}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.empty{text-align:center;padding:36px;color:var(--muted)}.lead{display:flex;border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden;margin-bottom:10px}.lead:before{content:"";width:5px;background:var(--gold)}.lead .body{padding:14px;flex:1}.lead .act{padding:14px;border-left:1px solid var(--line);display:flex;align-items:center}.toastbox{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}.toast{background:#111827;color:white;border-radius:9px;padding:11px 14px;box-shadow:0 6px 24px rgba(0,0,0,.15)}.notice{background:#fffdf8;border:1px solid #f0e8d0;border-radius:12px;padding:13px 15px;color:#73510e;font-size:13px}.bar{height:8px;border-radius:99px;background:#eee;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.hidden{display:none!important}@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.mobile{display:inline-flex}.split{grid-template-columns:1fr}.content{padding:15px}.search{min-width:100%}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand"><b>Windmore Metals</b><span>ScrapTrack operating tool</span></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main class="main">
  <header class="top"><button class="mobile" onclick="toggleSidebar()">☰</button><h1 id="pageTitle">Dashboard</h1><div class="toolbar" id="topActions"></div></header>
  <section class="content" id="app"></section>
</main>
<div class="toastbox" id="toasts"></div>
<input type="file" id="importFile" accept="application/json" class="hidden" onchange="importBackup(event)" />
<script>
const KEY='scraptrack_windmore_v1';
const NAV=[['Overview',[['dashboard','Dashboard','▦'],['prices','Metal Prices','↗']]],['Business',[['purchases','Purchases','🛒'],['sales','Sales','💵'],['inventory','Inventory','▣']]],['Contacts',[['sources','My Sources','👥'],['buyers','Buyers','🏭'],['suppliers','Find Suppliers','📍']]],['Analytics',[['reports','Reports','📊'],['settings','Settings','⚙']]]];
const TYPES=['Aluminum Rims','Steel Rims','Cast Aluminum','Copper Wire','Brass','Stainless Steel','Lead Wheel Weights','Mixed Load','Other'];
const DEFAULT_PRICES=[
 {cat:'Aluminum',grade:'Clean Auto Wheels / Alloy Rims',low:1.00,avg:1.15,high:1.30,tips:'Remove lead weights, valve stems, tires, and plastic cladding.'},
 {cat:'Aluminum',grade:'Dirty / Irony Aluminum Wheels',low:.75,avg:.85,high:.95,tips:'Minor contamination attached; sort before selling when possible.'},
 {cat:'Aluminum',grade:'Chrome / Clad Wheels',low:.50,avg:.60,high:.70,tips:'Plastic faces and chrome lower value.'},
 {cat:'Aluminum',grade:'Cast Aluminum',low:.50,avg:.62,high:.75,tips:'Engine blocks, cast parts, grills, patio furniture.'},
 {cat:'Aluminum',grade:'6063 Extrusion Clean',low:1.10,avg:1.46,high:1.81,tips:'Window frames and clean structural aluminum.'},
 {cat:'Copper',grade:'Bare Bright Copper Wire',low:4.10,avg:4.30,high:4.50,tips:'Stripped, shiny, uncoated wire.'},
 {cat:'Copper',grade:'#1 Copper Pipe / Bar',low:4.50,avg:4.69,high:4.80,tips:'Clean pipe or bus bar with no solder/fittings.'},
 {cat:'Copper',grade:'#2 Copper',low:4.30,avg:4.53,high:4.60,tips:'Oxidized or lightly coated copper.'},
 {cat:'Copper',grade:'Insulated Copper Wire',low:1.20,avg:1.85,high:2.50,tips:'Strip only when labor makes sense.'},
 {cat:'Brass',grade:'Yellow Brass',low:2.50,avg:2.76,high:2.90,tips:'Valves, fittings, and mixed brass.'},
 {cat:'Brass',grade:'Red Brass / Bronze',low:2.60,avg:2.76,high:2.95,tips:'Higher copper content than yellow brass.'},
 {cat:'Steel',grade:'Steel Rims',low:.08,avg:.10,high:.12,tips:'Thin margin; buy very low or free.'},
 {cat:'Steel',grade:'Heavy Steel #1 Prepared',low:.10,avg:.12,high:.14,tips:'Thicker prepared steel, typically under 5 ft.'},
 {cat:'Other',grade:'Stainless Steel 300 Series',low:.35,avg:.38,high:.42,tips:'Usually non-magnetic; test before grading.'},
 {cat:'Other',grade:'Lead Wheel Weights',low:.33,avg:.37,high:.42,tips:'Save weights removed from rims.'}
];
const LEADS=[
 {name:'CFC Recycling',city:'Dallas',phone:'214-584-6399',type:'Junkyard',rating:4.9,addr:'2716 Dowdy Ferry Rd, Dallas, TX',note:'Cash-for-junk-cars operation with constant vehicle flow.'},
 {name:'All Discount Auto Salvage',city:'Grand Prairie',phone:'972-263-3388',type:'Junkyard',rating:4.5,addr:'3965 E Main St, Grand Prairie, TX',note:'Large yard. Call ahead for rim availability.'},
 {name:'Garland Auto Recyclers',city:'Dallas',phone:'214-375-6002',type:'Junkyard',rating:4.2,addr:'4211 S Great Trinity Forest Way, Dallas, TX',note:'Open weekends. Good target for recurring check-ins.'},
 {name:'Lane Recyclers',city:'Dallas',phone:'469-248-0783',type:'Recycler',rating:4.3,addr:'11521 CF Hawn Fwy, Dallas, TX',note:'Can be useful for negotiating bulk rim loads.'},
 {name:"AAA Crain's Auto Salvage",city:'Fort Worth',phone:'469-274-5951',type:'Junkyard',rating:4.1,addr:'3300 Van Horn Ave, Fort Worth, TX',note:'Large Fort Worth yard with high turnover.'},
 {name:'American Auto Salvage',city:'Fort Worth',phone:'817-335-3328',type:'Junkyard',rating:4.0,addr:'2567 Decatur Ave, Fort Worth, TX',note:'Ask specifically about bulk rim purchases.'},
 {name:'Apache Iron Metal & Auto Salvage',city:'Fort Worth',phone:'817-478-5401',type:'Recycler',rating:3.9,addr:'1001 W Kennedale Pkwy, Fort Worth, TX',note:'Has scrap metal side; confirm buying schedule.'},
 {name:'Affordable Auto Salvage',city:'Grand Prairie',phone:'972-263-6666',type:'Junkyard',rating:3.9,addr:'4111 E Jefferson St, Grand Prairie, TX',note:'Near other yards; efficient to combine into one run.'}
];
let S={tab:'dashboard',q:'',priceCat:'All',period:'all',showForm:false,edit:null,data:{nextId:20,marketRate:.52,purchases:[{id:1,date:'2026-04-18',source:'South Dallas Junkyard',type:'Aluminum Rims',qty:24,lbs:336,total:120,notes:'Mixed 16/17 inch'},{id:2,date:'2026-04-24',source:'Carlos Mendez',type:'Aluminum Rims',qty:16,lbs:192,total:96,notes:'Clean OEM 18 inch'},{id:3,date:'2026-04-28',source:"Mike's Auto Repair",type:'Steel Rims',qty:30,lbs:510,total:76.5,notes:'Mixed sizes'},{id:4,date:'2026-05-01',source:'DFW Auto Auction',type:'Aluminum Rims',qty:32,lbs:416,total:166.4,notes:'Auction lot #44'}],sales:[{id:1,date:'2026-04-30',buyer:'Texas Aluminum Co.',type:'Aluminum Rims',lbs:336,rate:.52,total:174.72,notes:''},{id:2,date:'2026-05-06',buyer:'Metro Scrap Metals',type:'Steel Rims',lbs:510,rate:.11,total:56.1,notes:'Mixed steel lot'}],sources:[{id:1,name:'South Dallas Junkyard',type:'Junkyard',phone:'214-555-0182',city:'Dallas, TX',notes:'Best for bulk rims, call ahead'},{id:2,name:"Mike's Auto Repair",type:'Mechanic',phone:'817-555-0234',city:'Fort Worth, TX',notes:'Weekly pickups available'},{id:3,name:'DFW Auto Auction',type:'Auction',phone:'972-555-0156',city:'Irving, TX',notes:'Thursdays only'},{id:4,name:'Carlos Mendez',type:'Individual',phone:'214-555-0311',city:'Grand Prairie, TX',notes:'Fleet operator, OEM stock'}],buyers:[{id:1,name:'Texas Aluminum Co.',contact:'Robert Hill',phone:'713-555-0190',email:'rhill@texasal.com',rate:.52,notes:'Pays weekly, prefers clean aluminum'},{id:2,name:'Metro Scrap Metals',contact:'Sarah Johnson',phone:'214-555-0278',email:'sjohnson@metroscrap.com',rate:.48,notes:'Accepts mixed loads'}],prices:DEFAULT_PRICES,lastUpdated:'2026-05-11'}};
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.data)S.data=d.data;}}catch(e){console.warn(e)}}
function save(){localStorage.setItem(KEY,JSON.stringify({data:S.data}));}
function id(){S.data.nextId=(S.data.nextId||20)+1;save();return S.data.nextId;}
function money(n){return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function num(n){return Number(n||0).toLocaleString()}
function lb(n){return num(n)+' lbs'}
function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function today(){return new Date().toISOString().slice(0,10)}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),2600)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function nav(){document.getElementById('nav').innerHTML=NAV.map(([sec,items])=>`<small>${sec}</small>`+items.map(([key,label,icon])=>`<button class="${S.tab===key?'active':''}" onclick="go('${key}')"><span>${icon}</span>${label}</button>`).join('')).join('')}
function go(t){S.tab=t;S.showForm=false;S.edit=null;S.q='';document.getElementById('sidebar').classList.remove('open');render()}
function badge(t){let c=t.includes('Aluminum')?'b-blue':t.includes('Steel')?'b-gray':t.includes('Copper')?'b-gold':t.includes('Brass')?'b-green':t.includes('Lead')?'b-red':'b-gray';return `<span class="badge ${c}">${esc(t)}</span>`}
function filterRows(rows){const q=S.q.toLowerCase();return !q?rows:[...rows].filter(r=>Object.values(r).join(' ').toLowerCase().includes(q))}
function totals(){const pcost=S.data.purchases.reduce((a,b)=>a+Number(b.total||0),0),plbs=S.data.purchases.reduce((a,b)=>a+Number(b.lbs||0),0),rev=S.data.sales.reduce((a,b)=>a+Number(b.total||0),0),slbs=S.data.sales.reduce((a,b)=>a+Number(b.lbs||0),0);return{pcost,plbs,rev,slbs,profit:rev-pcost,inventory:plbs-slbs,avgBuy:plbs?pcost/plbs:0,avgSell:slbs?rev/slbs:0,margin:rev?((rev-pcost)/rev)*100:0}}
function inventory(){const map={};S.data.purchases.forEach(p=>{map[p.type]=map[p.type]||{type:p.type,bought:0,sold:0,cost:0,rev:0};map[p.type].bought+=Number(p.lbs||0);map[p.type].cost+=Number(p.total||0)});S.data.sales.forEach(s=>{map[s.type]=map[s.type]||{type:s.type,bought:0,sold:0,cost:0,rev:0};map[s.type].sold+=Number(s.lbs||0);map[s.type].rev+=Number(s.total||0)});return Object.values(map).map(x=>({...x,onHand:x.bought-x.sold,avgCost:x.bought?x.cost/x.bought:0,avgSell:x.sold?x.rev/x.sold:0,value:(x.bought-x.sold)*(x.avgSell||S.data.marketRate)}))}
function metrics(){const t=totals();return `<div class="grid"><div class="metric"><small>Total Revenue</small><strong style="color:var(--green)">${money(t.rev)}</strong><span>${lb(t.slbs)} sold</span></div><div class="metric"><small>Total Purchases</small><strong>${money(t.pcost)}</strong><span>${lb(t.plbs)} bought</span></div><div class="metric"><small>Net Profit</small><strong style="color:${t.profit>=0?'var(--green)':'var(--red)'}">${money(t.profit)}</strong><span>${t.margin.toFixed(1)}% margin</span></div><div class="metric"><small>Inventory</small><strong style="color:var(--blue)">${lb(t.inventory)}</strong><span>Est. ${money(t.inventory*S.data.marketRate)}</span></div><div class="metric"><small>Avg Buy</small><strong>$${t.avgBuy.toFixed(3)}</strong><span>per lb</span></div><div class="metric"><small>Avg Sell</small><strong>$${t.avgSell.toFixed(3)}</strong><span>per lb</span></div></div>`}
function renderDashboard(){const recent=[...S.data.purchases.map(x=>({date:x.date,kind:'Buy',txt:`Bought ${x.qty||0} units / ${lb(x.lbs)} from ${x.source}`,amt:-x.total})),...S.data.sales.map(x=>({date:x.date,kind:'Sell',txt:`Sold ${lb(x.lbs)} to ${x.buyer}`,amt:x.total}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);return metrics()+`<div class="split"><div class="card"><div class="card-h"><b>Recent Activity</b></div><div class="tablewrap"><table><tbody>${recent.map(r=>`<tr><td><span class="badge ${r.kind==='Sell'?'b-green':'b-gold'}">${r.kind}</span></td><td><b>${esc(r.txt)}</b><div class="muted">${r.date}</div></td><td class="right" style="color:${r.amt>=0?'var(--green)':'var(--red)'};font-weight:800">${r.amt>=0?'+':''}${money(r.amt)}</td></tr>`).join('')||'<tr><td class="empty">No activity yet</td></tr>'}</tbody></table></div></div><div class="card"><div class="card-h"><b>Quick Market Rate</b></div><div class="card-b"><div class="field"><label>Default inventory value rate</label><input type="number" step="0.001" value="${S.data.marketRate}" onchange="S.data.marketRate=Number(this.value||0);save();render()"></div><p class="muted">Used to estimate unsold inventory value on the dashboard.</p><div class="notice">Tip: update this based on the best aluminum rim buyer rate each morning.</div></div></div></div>`}
function renderPrices(){let cats=['All',...new Set(S.data.prices.map(p=>p.cat))];let rows=S.priceCat==='All'?S.data.prices:S.data.prices.filter(p=>p.cat===S.priceCat);return `<div class="notice" style="margin-bottom:14px">This static GitHub version uses editable price tables instead of live API calls. That avoids browser/API-key issues and makes the app reliable on GitHub Pages.</div><div class="tabs">${cats.map(c=>`<button class="${S.priceCat===c?'active':''}" onclick="S.priceCat='${c}';render()">${c}</button>`).join('')}</div><div class="card"><div class="card-h"><b>Metal Prices</b><button class="btn primary small" onclick="addPriceRow()">+ Add Grade</button></div><div class="tablewrap"><table><thead><tr><th>Category</th><th>Grade</th><th class="right">Low</th><th class="right">Avg</th><th class="right">High</th><th>Notes</th><th></th></tr></thead><tbody>${rows.map((p,i)=>{let idx=S.data.prices.indexOf(p);return `<tr><td><input value="${esc(p.cat)}" onchange="S.data.prices[${idx}].cat=this.value;save()"></td><td><input value="${esc(p.grade)}" onchange="S.data.prices[${idx}].grade=this.value;save()"></td><td><input type="number" step="0.01" value="${p.low}" onchange="S.data.prices[${idx}].low=Number(this.value);save()"></td><td><input type="number" step="0.01" value="${p.avg}" onchange="S.data.prices[${idx}].avg=Number(this.value);save()"></td><td><input type="number" step="0.01" value="${p.high}" onchange="S.data.prices[${idx}].high=Number(this.value);save()"></td><td><input value="${esc(p.tips)}" onchange="S.data.prices[${idx}].tips=this.value;save()"></td><td><button class="btn danger small" onclick="delPrice(${idx})">Delete</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function addPriceRow(){S.data.prices.push({cat:'Aluminum',grade:'New Grade',low:0,avg:0,high:0,tips:''});save();render()}function delPrice(i){if(confirm('Delete this price row?')){S.data.prices.splice(i,1);save();render()}}
function topActions(){let html='';if(['purchases','sales','sources','buyers'].includes(S.tab)){html+=`<button class="btn ghost small" onclick="exportCSV('${S.tab}')">Export CSV</button><button class="btn primary small" onclick="S.showForm=!S.showForm;S.edit=null;render()">${S.showForm?'Close':'Add'}</button>`}if(S.tab==='inventory'){html+=`<button class="btn ghost small" onclick="exportCSV('inventory')">Export CSV</button>`}return html}
function searchBox(ph){return `<input class="search" placeholder="${ph}" value="${esc(S.q)}" oninput="S.q=this.value;render()">`}
function renderPurchases(){let rows=filterRows([...S.data.purchases].sort((a,b)=>b.date.localeCompare(a.date)));return `${formPurchase()}<div class="card"><div class="card-h"><b>Purchases</b>${searchBox('Search purchases...')}</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Source</th><th>Type</th><th class="right">Qty</th><th class="right">Lbs</th><th class="right">Paid</th><th class="right">$/lb</th><th>Notes</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${p.date}</td><td><b>${esc(p.source)}</b></td><td>${badge(p.type)}</td><td class="right">${num(p.qty)}</td><td class="right">${lb(p.lbs)}</td><td class="right">${money(p.total)}</td><td class="right">$${(p.total/p.lbs||0).toFixed(3)}</td><td class="muted">${esc(p.notes)}</td><td><button class="btn ghost small" onclick="editRow('purchase',${p.id})">Edit</button> <button class="btn danger small" onclick="deleteRow('purchase',${p.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No purchases found</td></tr>'}</tbody></table></div></div>`}
function formPurchase(){if(!S.showForm&&S.edit?.kind!=='purchase')return'';let p=S.edit?.kind==='purchase'?S.edit.row:{date:today(),source:'',type:'Aluminum Rims',qty:0,lbs:0,total:0,notes:''};return `<div class="card"><div class="card-h"><b>${S.edit?'Edit':'Log'} Purchase</b></div><div class="card-b"><div class="formgrid"><div class="field"><label>Date</label><input id="p_date" type="date" value="${p.date}"></div><div class="field"><label>Source</label><input id="p_source" list="sourceList" value="${esc(p.source)}"></div><div class="field"><label>Metal Type</label><select id="p_type">${TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input id="p_qty" type="number" value="${p.qty}"></div><div class="field"><label>Weight lbs</label><input id="p_lbs" type="number" step="0.1" value="${p.lbs}"></div><div class="field"><label>Total Paid</label><input id="p_total" type="number" step="0.01" value="${p.total}"></div><div class="field" style="grid-column:1/-1"><label>Notes</label><input id="p_notes" value="${esc(p.notes)}"></div></div><div class="actions"><button class="btn primary" onclick="savePurchase()">Save Purchase</button><button class="btn ghost" onclick="S.showForm=false;S.edit=null;render()">Cancel</button></div><datalist id="sourceList">${S.data.sources.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist></div></div>`}
function savePurchase(){let row={id:S.edit?.kind==='purchase'?S.edit.row.id:id(),date:val('p_date'),source:val('p_source'),type:val('p_type'),qty:Number(val('p_qty')),lbs:Number(val('p_lbs')),total:Number(val('p_total')),notes:val('p_notes')};if(!row.source||!row.lbs){toast('Source and weight are required');return}upsert('purchases',row);toast('Purchase saved');}
function renderSales(){let rows=filterRows([...S.data.sales].sort((a,b)=>b.date.localeCompare(a.date)));return `${formSale()}<div class="card"><div class="card-h"><b>Sales</b>${searchBox('Search sales...')}</div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Buyer</th><th>Type</th><th class="right">Lbs</th><th class="right">Rate</th><th class="right">Total</th><th>Notes</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td>${s.date}</td><td><b>${esc(s.buyer)}</b></td><td>${badge(s.type)}</td><td class="right">${lb(s.lbs)}</td><td class="right">$${Number(s.rate||0).toFixed(3)}</td><td class="right" style="color:var(--green);font-weight:800">${money(s.total)}</td><td class="muted">${esc(s.notes)}</td><td><button class="btn ghost small" onclick="editRow('sale',${s.id})">Edit</button> <button class="btn danger small" onclick="deleteRow('sale',${s.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No sales found</td></tr>'}</tbody></table></div></div>`}
function formSale(){if(!S.showForm&&S.edit?.kind!=='sale')return'';let s=S.edit?.kind==='sale'?S.edit.row:{date:today(),buyer:'',type:'Aluminum Rims',lbs:0,rate:S.data.marketRate,total:0,notes:''};return `<div class="card"><div class="card-h"><b>${S.edit?'Edit':'Log'} Sale</b></div><div class="card-b"><div class="formgrid"><div class="field"><label>Date</label><input id="s_date" type="date" value="${s.date}"></div><div class="field"><label>Buyer</label><input id="s_buyer" list="buyerList" value="${esc(s.buyer)}"></div><div class="field"><label>Metal Type</label><select id="s_type">${TYPES.map(t=>`<option ${s.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Weight lbs</label><input id="s_lbs" type="number" step="0.1" value="${s.lbs}" oninput="calcSale()"></div><div class="field"><label>Rate $/lb</label><input id="s_rate" type="number" step="0.001" value="${s.rate}" oninput="calcSale()"></div><div class="field"><label>Total</label><input id="s_total" type="number" step="0.01" value="${s.total||((s.lbs||0)*(s.rate||0)).toFixed(2)}"></div><div class="field" style="grid-column:1/-1"><label>Notes</label><input id="s_notes" value="${esc(s.notes)}"></div></div><div class="actions"><button class="btn primary" onclick="saveSale()">Save Sale</button><button class="btn ghost" onclick="S.showForm=false;S.edit=null;render()">Cancel</button></div><datalist id="buyerList">${S.data.buyers.map(b=>`<option value="${esc(b.name)}">`).join('')}</datalist></div></div>`}
function calcSale(){let lbs=Number(val('s_lbs')),rate=Number(val('s_rate'));document.getElementById('s_total').value=(lbs*rate).toFixed(2)}function saveSale(){let row={id:S.edit?.kind==='sale'?S.edit.row.id:id(),date:val('s_date'),buyer:val('s_buyer'),type:val('s_type'),lbs:Number(val('s_lbs')),rate:Number(val('s_rate')),total:Number(val('s_total')),notes:val('s_notes')};if(!row.buyer||!row.lbs){toast('Buyer and weight are required');return}upsert('sales',row);toast('Sale saved')}
function renderInventory(){let rows=inventory();let value=rows.reduce((a,b)=>a+(b.onHand*Math.max(b.avgSell,S.data.marketRate)),0);return `<div class="grid"><div class="metric"><small>Types on Hand</small><strong>${rows.filter(r=>r.onHand>0).length}</strong><span>material categories</span></div><div class="metric"><small>Total On Hand</small><strong>${lb(rows.reduce((a,b)=>a+b.onHand,0))}</strong><span>purchased minus sold</span></div><div class="metric"><small>Estimated Value</small><strong style="color:var(--green)">${money(value)}</strong><span>uses avg sell / market rate</span></div></div><div class="card"><div class="card-h"><b>Inventory by Metal Type</b></div><div class="tablewrap"><table><thead><tr><th>Type</th><th class="right">Bought</th><th class="right">Sold</th><th class="right">On Hand</th><th class="right">Avg Cost</th><th class="right">Avg Sell</th><th class="right">Est. Value</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${badge(r.type)}</td><td class="right">${lb(r.bought)}</td><td class="right">${lb(r.sold)}</td><td class="right"><b>${lb(r.onHand)}</b></td><td class="right">$${r.avgCost.toFixed(3)}</td><td class="right">$${r.avgSell.toFixed(3)}</td><td class="right">${money(r.onHand*Math.max(r.avgSell,S.data.marketRate))}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No inventory yet</td></tr>'}</tbody></table></div></div><p class="muted">Inventory is calculated from total pounds purchased minus total pounds sold. For advanced operations, the next version should add lot-level FIFO tracking.</p>`}
function renderSources(){return renderContacts('sources','Source',['name','type','phone','city','notes'])}function renderBuyers(){return renderContacts('buyers','Buyer',['name','contact','phone','email','rate','notes'])}
function renderContacts(kind,label,fields){let rows=filterRows(S.data[kind]);return `${formContact(kind,label,fields)}<div class="card"><div class="card-h"><b>${label}s</b>${searchBox('Search '+label.toLowerCase()+'s...')}</div><div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${f}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr>${fields.map(f=>`<td>${f==='rate'?'$'+Number(r[f]||0).toFixed(3):esc(r[f])}</td>`).join('')}<td><button class="btn ghost small" onclick="editRow('${kind.slice(0,-1)}',${r.id})">Edit</button> <button class="btn danger small" onclick="deleteRow('${kind.slice(0,-1)}',${r.id})">Delete</button></td></tr>`).join('')||`<tr><td colspan="${fields.length+1}" class="empty">No ${label.toLowerCase()}s found</td></tr>`}</tbody></table></div></div>`}
function formContact(kind,label,fields){let singular=kind.slice(0,-1);if(!S.showForm&&S.edit?.kind!==singular)return'';let r=S.edit?.kind===singular?S.edit.row:{};return `<div class="card"><div class="card-h"><b>${S.edit?'Edit':'Add'} ${label}</b></div><div class="card-b"><div class="formgrid">${fields.map(f=>`<div class="field"><label>${f}</label><input id="c_${f}" ${f==='rate'?'type="number" step="0.001"':''} value="${esc(r[f]||'')}"></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="saveContact('${kind}')">Save ${label}</button><button class="btn ghost" onclick="S.showForm=false;S.edit=null;render()">Cancel</button></div></div></div>`}
function saveContact(kind){let singular=kind.slice(0,-1), base=S.edit?.kind===singular?S.edit.row:{id:id()};Object.keys(base).forEach(()=>{});document.querySelectorAll('[id^="c_"]').forEach(el=>{let f=el.id.slice(2);base[f]=el.type==='number'?Number(el.value||0):el.value});if(!base.name){toast('Name is required');return}upsert(kind,base);toast('Saved')}
function renderSuppliers(){let q=S.q.toLowerCase();let rows=!q?LEADS:LEADS.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));return `<div class="card"><div class="card-h"><b>Supplier Lead Finder</b>${searchBox('Search city, name, or type...')}</div><div class="card-b"><div class="notice" style="margin-bottom:14px">Static lead list for DFW. Add promising yards to My Sources, then track purchases from them.</div>${rows.map(l=>`<div class="lead"><div class="body"><b>${esc(l.name)}</b> <span class="badge b-gold">${l.rating} ★</span><div class="muted">${esc(l.type)} · ${esc(l.city)} · ${esc(l.phone)}</div><div class="muted">${esc(l.addr)}</div><p>${esc(l.note)}</p></div><div class="act"><button class="btn primary small" onclick="addLead('${esc(l.name)}')">Add</button></div></div>`).join('')||'<div class="empty">No leads found</div>'}</div></div>`}
function addLead(name){let l=LEADS.find(x=>x.name===name);if(!l)return;if(S.data.sources.some(s=>s.name===l.name)){toast('Already saved');return}S.data.sources.push({id:id(),name:l.name,type:l.type,phone:l.phone,city:l.city+', TX',notes:l.note});save();toast('Added to sources')}
function periodRows(rows,field='date'){if(S.period==='all')return rows;let now=new Date();let days=S.period==='30'?30:S.period==='90'?90:365;let cutoff=new Date(now.getTime()-days*864e5).toISOString().slice(0,10);return rows.filter(r=>r[field]>=cutoff)}
function renderReports(){let purchases=periodRows(S.data.purchases),sales=periodRows(S.data.sales);let cost=purchases.reduce((a,b)=>a+b.total,0),rev=sales.reduce((a,b)=>a+b.total,0);let byType={};purchases.forEach(p=>{byType[p.type]=byType[p.type]||{cost:0,rev:0};byType[p.type].cost+=p.total});sales.forEach(s=>{byType[s.type]=byType[s.type]||{cost:0,rev:0};byType[s.type].rev+=s.total});let max=Math.max(1,...Object.values(byType).map(v=>Math.max(v.cost,v.rev)));return `<div class="tabs">${[['all','All Time'],['30','30 Days'],['90','90 Days'],['365','12 Months']].map(([k,l])=>`<button class="${S.period===k?'active':''}" onclick="S.period='${k}';render()">${l}</button>`).join('')}</div><div class="grid"><div class="metric"><small>Revenue</small><strong style="color:var(--green)">${money(rev)}</strong></div><div class="metric"><small>Cost</small><strong>${money(cost)}</strong></div><div class="metric"><small>Profit</small><strong style="color:${rev-cost>=0?'var(--green)':'var(--red)'}">${money(rev-cost)}</strong></div><div class="metric"><small>Margin</small><strong>${rev?((rev-cost)/rev*100).toFixed(1):'0.0'}%</strong></div></div><div class="card"><div class="card-h"><b>P&L by Metal Type</b></div><div class="card-b">${Object.entries(byType).map(([type,v])=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><b>${type}</b><span>${money(v.rev-v.cost)}</span></div><div class="muted">Revenue ${money(v.rev)} · Cost ${money(v.cost)}</div><div class="bar"><i style="width:${Math.max(v.rev/max*100,2)}%"></i></div></div>`).join('')||'<div class="empty">No report data</div>'}</div></div>`}
function renderSettings(){return `<div class="card"><div class="card-h"><b>Data & Settings</b></div><div class="card-b"><div class="formgrid"><div class="field"><label>Default Market Rate $/lb</label><input type="number" step="0.001" value="${S.data.marketRate}" onchange="S.data.marketRate=Number(this.value);save();toast('Rate updated')"></div></div><div class="actions"><button class="btn ghost" onclick="backup()">Download Backup JSON</button><button class="btn ghost" onclick="document.getElementById('importFile').click()">Import Backup</button><button class="btn danger" onclick="resetDemo()">Reset Demo Data</button></div><p class="muted">All information is stored locally in this browser. GitHub does not store the database unless you export a backup.</p></div></div>`}
function val(id){return document.getElementById(id)?.value||''}function upsert(arr,row){let a=S.data[arr],i=a.findIndex(x=>x.id===row.id);if(i>=0)a[i]=row;else a.push(row);save();S.showForm=false;S.edit=null;render()}function editRow(kind,idv){let arr=kind==='purchase'?'purchases':kind==='sale'?'sales':kind==='source'?'sources':'buyers';let row=S.data[arr].find(x=>x.id===idv);S.edit={kind,row:{...row}};S.showForm=true;render()}function deleteRow(kind,idv){let arr=kind==='purchase'?'purchases':kind==='sale'?'sales':kind==='source'?'sources':'buyers';if(confirm('Delete this record?')){S.data[arr]=S.data[arr].filter(x=>x.id!==idv);save();render()}}
function exportCSV(kind){let rows=[];if(kind==='inventory'){rows=[['Type','Bought lbs','Sold lbs','On Hand lbs','Avg Cost','Avg Sell','Est Value'],...inventory().map(r=>[r.type,r.bought,r.sold,r.onHand,r.avgCost.toFixed(3),r.avgSell.toFixed(3),(r.onHand*Math.max(r.avgSell,S.data.marketRate)).toFixed(2)])]}else{let data=S.data[kind]||[];let keys=Object.keys(data[0]||{});rows=[keys,...data.map(r=>keys.map(k=>r[k]))]}let csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`scraptrack_${kind}.csv`;a.click()}
function backup(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S.data,null,2));a.download='scraptrack_backup.json';a.click()}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.purchases||!d.sales)throw new Error('Invalid backup');S.data=d;save();toast('Backup imported');render()}catch(err){toast('Import failed: '+err.message)}};r.readAsText(f)}function resetDemo(){if(confirm('Reset to demo data? This will replace current local data.')){localStorage.removeItem(KEY);location.reload()}}
function render(){nav();document.getElementById('pageTitle').textContent=({dashboard:'Dashboard',prices:'Metal Prices',purchases:'Purchases',sales:'Sales',inventory:'Inventory',sources:'My Sources',buyers:'Buyers',suppliers:'Find Suppliers',reports:'Reports',settings:'Settings'})[S.tab];document.getElementById('topActions').innerHTML=topActions();let map={dashboard:renderDashboard,prices:renderPrices,purchases:renderPurchases,sales:renderSales,inventory:renderInventory,sources:renderSources,buyers:renderBuyers,suppliers:renderSuppliers,reports:renderReports,settings:renderSettings};document.getElementById('app').innerHTML=map[S.tab]();}
load();render();
</script>
</body>
</html>
